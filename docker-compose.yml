version: '3.8'
services:
  database:
    container_name: rbtmweb_database_1
    image: postgres:16
    # ports:
    #   - "15432:5432"
    volumes:
      - /home/robotom/rbtm_data/rbtm_web/db:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: robotom_users_1

  server:
    build: .
    container_name: rbtmweb_server_1
    ports:
      - "5080:80"
    depends_on:
      - database
    external_links:
      - rbtmstorage_server_1
    networks:
      - default
      - rbtmstorage_default
    # volumes:
    #   - ./robotom/logs:/var/www/web/robotom/logs
    restart: unless-stopped

networks:
  rbtmstorage_default:
    external: true
